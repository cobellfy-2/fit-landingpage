# Schritt B: Installiere eine Node.js Umgebung auf dem Server
# In GitLab machen wir das, indem wir direkt ein fertiges Node-Docker-Image laden
image: node:20

# Definiere die Phasen (Stages) deiner Pipeline
stages:
  - test

# Definiere den Job
run-tests:
  stage: test
  
  # 1. Wann soll die Pipeline starten?
  # Hier definieren wir, dass es beim Push auf "main" oder bei Merge Requests läuft
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

  # 2. Was soll die Pipeline tun?
  script:
    # Schritt A (Code auschecken) passiert in GitLab vollautomatisch im Hintergrund!
    
    # Schritt C: Installiere alle in der package.json definierten Pakete
    - npm ci
    
    # Schritt D: Führe Jest aus
    - npm test -- --ci --coverage