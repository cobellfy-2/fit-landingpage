name: Jest CI Pipeline

# 1. Wann soll die Pipeline starten?
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. Was soll die Pipeline tun?
jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    # Schritt A: Lade den aktuellen Code aus dem Repository herunter
    - name: Code auschecken
      uses: actions/checkout@v4

    # Schritt B: Installiere eine Node.js Umgebung auf dem Server
    - name: Node.js einrichten
      uses: actions/setup-node@v4
      with:
        node-version: '20.x' # Wähle die Version, die dein Projekt nutzt

    # Schritt C: Installiere alle in der package.json definierten Pakete
    - name: Abhängigkeiten installieren
      run: npm ci

    # Schritt D: Führe Jest aus
    - name: Jest Tests ausführen
      run: npm test -- --ci --coverage